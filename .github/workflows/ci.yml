name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        opencv-version: ["4", "5"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libegl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install package
        run: |
          pip install .[dev,tool]
          pip install "opencv-python==${{ matrix.opencv-version }}.*" "opencv-contrib-python==${{ matrix.opencv-version }}.*"
          cd packages/mvtb-data && pip install .

      - name: Install open3d (one leg per supported Python version)
        if: matrix.os == 'ubuntu-latest' && matrix.opencv-version == '5'
        run: pip install open3d

      - name: Install ros extra (rosbags, roslibpy, websockets)
        if: matrix.os == 'ubuntu-latest' && matrix.opencv-version == '5'
        run: pip install .[ros]

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest --timeout=50 --timeout-method=thread

  pgraph-compat:
    # BundleAdjust is the only pgraph user and pgraph 1.0 changed API (keyword-only
    # graph constructors, UVertex -> Vertex, edges() a list).  The main matrix
    # installs whatever pip resolves, so run the pgraph-touching tests against
    # both the 0.6 series and the newest release explicitly.
    name: pgraph compat (${{ matrix.pgraph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pgraph: ["pgraph-python<1", "pgraph-python"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install libegl
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install package
        run: |
          pip install .[dev,tool]
          cd packages/mvtb-data && pip install .

      - name: Install requested pgraph
        run: |
          pip install --upgrade "${{ matrix.pgraph }}"
          pip show pgraph-python | grep -i '^version'

      - name: Run pgraph tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/test_bundleadjust.py --timeout=50 --timeout-method=thread

  typecheck:
    name: typecheck and build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # open3d and the ros extra are installed so that mypy sees their types: a
      # "type: ignore" for one of them is unused, and so an error, where it is missing
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,ros]
          pip install open3d build

      # configuration is in pyproject.toml, [tool.mypy]; the package must stay at zero errors
      - name: Run mypy
        run: mypy

      - name: Build wheel and verify typed marker
        run: |
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("machinevision_toolbox_python-*.whl"))
          with ZipFile(wheel) as archive:
              assert "machinevisiontoolbox/py.typed" in archive.namelist(), (
                  f"{wheel.name} is missing machinevisiontoolbox/py.typed"
              )
          PY

  all-tests-passed:
    name: All tests passed
    needs: [test, pgraph-compat, typecheck]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.pgraph-compat.result }}" != "success" ]; then
            echo "pgraph compat did not succeed: ${{ needs.pgraph-compat.result }}"
            exit 1
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "typecheck did not succeed: ${{ needs.typecheck.result }}"
            exit 1
          fi

  codecov:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install libegl
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      # The optional extras, so that the tests of PointCloud, the PyTorch methods and
      # the ROS sources run and count; without them they are skipped and Codecov
      # reports PointCloud at 22%, ImageTensor at 23% and Sources at 35%.
      # PyTorch comes from the CPU index, which is much smaller.
      - name: Install package
        run: |
          pip install .[dev,tool,open3d,ros]
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          cd packages/mvtb-data && pip install .

      - name: Run coverage
        env:
          MPLBACKEND: Agg
        run: |
          coverage run --source=machinevisiontoolbox -m pytest --timeout=50
          coverage xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
